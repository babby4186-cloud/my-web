
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Special Date 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Trebuchet MS', sans-serif;
    overflow: hidden;
}

/* SCENES */

.scene {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transition: opacity 1s ease;
}

.scene.active {
    opacity: 1;
    visibility: visible;
}

/* SCENE 1 */

#scene1 {
    background: linear-gradient(135deg, #ffd6e7, #ffb6d5, #ffe6f0);
    z-index: 3;
}

.card {
    width: 90%;
    max-width: 370px;
    padding: 35px 22px;
    background: rgba(255,255,255,0.8);
    border: 3px solid white;
    border-radius: 30px;
    box-shadow: 0 12px 35px rgba(255,80,150,0.2);
    z-index: 2;
    animation: appear 1s ease;
}

@keyframes appear {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.kitty {
    font-size: 65px;
    margin-bottom: 10px;
}

h1 {
    font-size: 25px;
    margin-bottom: 10px;
    color: #d63384;
}

p {
    font-size: 14px;
    margin-bottom: 25px;
    color: #e36a9b;
}

.date-inputs {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 25px;
}

select {
    padding: 13px;
    width: 95px;
    border: 2px solid #ffb0d0;
    border-radius: 15px;
    background: #fff0f6;
    color: #d63384;
    font-size: 18px;
    font-weight: bold;
}

.slash {
    font-size: 25px;
    color: #d63384;
    font-weight: bold;
}

button {
    padding: 14px 25px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(90deg, #ff83b5, #ff4f96);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    margin-top: 18px;
    font-weight: bold;
    min-height: 20px;
    color: #d63384;
}

/* FLOATING HEARTS */

.heart {
    position: absolute;
    bottom: -50px;
    animation: float 8s linear infinite;
    pointer-events: none;
}

@keyframes float {
    0% {
        transform: translateY(0);
        opacity: 0;
    }
    20% { opacity: 0.7; }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* SCENE 2 */

#scene2 {
    z-index: 2;
    background: #f5a6c8;
}

#emojiRain {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.love {
    position: absolute;
    top: -60px;
    animation: fall linear forwards;
    user-select: none;
}

@keyframes fall {
    0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 1; }
    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0.8;
    }
}

/* MESSAGE ANIMATION */

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 20px;
}

.messages {
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.animated-text {
    position: absolute;
    width: 100%;
    padding: 0 10px;
    color: #ffe1ef;
    font-size: 27px;
    font-weight: bold;
    text-shadow: 0 0 12px white, 0 0 22px #ffb6d5;
    opacity: 0;
    transform: translateY(20px) scale(0.8);
    transition: opacity 0.7s ease, transform 0.7s ease;
}

.animated-text.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

.animated-text.hide {
    opacity: 0;
    transform: translateY(-20px) scale(0.9);
}

.continue-button {
    margin-top: 40px;
    background: #f78fba;
    border: 2px solid white;
    border-radius: 30px;
    box-shadow: 0 0 20px white;
    opacity: 0;
    transition: opacity 1s ease;
    pointer-events: none;
}

.continue-button.show {
    opacity: 1;
    pointer-events: auto;
}

/* SCENE 3 */

#scene3 {
    z-index: 1;
    background: #f8b9d2;
}

#hello {
    color: #ffe1ef;
    font-size: 40px;
    text-shadow: 0 0 15px white;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    to {
        text-shadow: 0 0 25px white, 0 0 45px #ffb6d5;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND MUSIC -->
<!-- Keep this outside all scenes so it never disappears -->

<audio id="loveSong" loop preload="auto">
    <source src="UNETHICAL%20-%20Faouzia.mp3" type="audio/mpeg">
</audio>

<!-- SCENE 1 -->

<div class="scene active" id="scene1">

    <div id="hearts"></div>

    <div class="card">

        <div class="kitty">🎀🐱💗</div>

        <h1>Our Special Date</h1>

        <p>
            Hey babyyy! 💕<br>
            Do you remember our favourite date?
        </p>

        <h3 style="margin-bottom:15px;color:#d63384;">
            Enter our fav date 💌
        </h3>

        <div class="date-inputs">

            <select id="day">
                <option value="">Day</option>
            </select>

            <span class="slash">/</span>

            <select id="month">
                <option value="">Month</option>
            </select>

        </div>

        <button onclick="checkDate()">ENTER 💗</button>

        <div id="message"></div>

        <div style="margin-top:25px;font-size:25px;">
            For My Love🥰
        </div>

    </div>
</div>


<!-- SCENE 2 -->

<div class="scene" id="scene2">

    <div id="emojiRain"></div>

    <div class="content">

        <div class="messages">

            <div class="animated-text" id="text1">
                heyyy babyyy 💗
            </div>

            <div class="animated-text" id="text2">
                i hope u will love thiss 🥺
            </div>

            <div class="animated-text" id="text3">
                i love uuu soo much 💞
            </div>

        </div>

        <button class="continue-button" id="continueBtn"
            onclick="goToScene3()">
            Continue, my love 💗 →
        </button>

    </div>
</div>


<!-- SCENE 3 -->

<div class="scene" id="scene3">
    <h1 id="hello">hello world ♡</h1>
</div>


<script>

// POPULATE DATE SELECTORS

const day = document.getElementById("day");

for(let i = 1; i <= 31; i++) {
    let option = document.createElement("option");
    option.value = i;
    option.textContent = String(i).padStart(2, "0");
    day.appendChild(option);
}

const month = document.getElementById("month");

for(let i = 1; i <= 12; i++) {
    let option = document.createElement("option");
    option.value = i;
    option.textContent = String(i).padStart(2, "0");
    month.appendChild(option);
}


// SCENE NAVIGATION

function showScene(id) {

    document.querySelectorAll(".scene").forEach(scene => {
        scene.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


// CHECK DATE + START MUSIC

async function checkDate() {

    let d = Number(day.value);
    let m = Number(month.value);

    const message = document.getElementById("message");

    if(d === 29 && m === 9) {

        message.innerHTML = "YAYYYY!! YOU REMEMBERED!! 💗";

        setTimeout(async () => {

            // Show scene 2
            showScene("scene2");

            // START MUSIC
            const song = document.getElementById("loveSong");

            song.volume = 0.7;

            try {
                await song.play();
            } catch(error) {
                console.log("Music playback failed:", error);
                message.innerHTML =
                    "Tap to play the music, my love 💗";
            }

            // Start animations
            startEmojiRain();
            startMessages();

        }, 1200);

    } else {

        message.innerHTML =
            "Wrong date babyyy! Try again 🥺💔";

    }
}


// SCENE 1 FLOATING HEARTS

const heartContainer = document.getElementById("hearts");

const symbols = [
    "💗", "💕", "💖", "🎀", "🌸", "💘", "💋"
];

for(let i = 0; i < 25; i++) {

    let heart = document.createElement("div");

    heart.className = "heart";

    heart.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    heart.style.left = Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 25) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    heart.style.animationDelay =
        Math.random() * 8 + "s";

    heartContainer.appendChild(heart);
}


// SCENE 2 FALLING EMOJIS

const rain = document.getElementById("emojiRain");

const emojis = [
    "💗", "💕", "💖", "💘",
    "❤️", "🩷", "💞", "💓",
    "💝", "🥰", "🌸", "💟"
];

let rainInterval;

function createLove() {

    const love = document.createElement("div");

    love.className = "love";

    love.innerText =
        emojis[Math.floor(Math.random() * emojis.length)];

    love.style.left = Math.random() * 100 + "vw";

    love.style.fontSize =
        (15 + Math.random() * 25) + "px";

    love.style.animationDuration =
        (4 + Math.random() * 6) + "s";

    rain.appendChild(love);

    setTimeout(() => love.remove(), 11000);
}

function startEmojiRain() {

    if(rainInterval) return;

    createLove();

    rainInterval = setInterval(createLove, 250);
}


// SEQUENTIAL MESSAGE SYSTEM

const messages = [
    document.getElementById("text1"),
    document.getElementById("text2"),
    document.getElementById("text3")
];

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function startMessages() {

    const button = document.getElementById("continueBtn");

    button.classList.remove("show");

    for(let i = 0; i < messages.length; i++) {

        const current = messages[i];

        // Show current message
        current.classList.remove("hide");
        current.classList.add("show");

        // Keep it visible
        await wait(2200);

        // Make it disappear
        current.classList.remove("show");
        current.classList.add("hide");

        // Wait before next message
        await wait(800);
    }

    // Show continue button
    button.classList.add("show");
}


// SCENE 3

function goToScene3() {

    // Music keeps playing because audio is outside the scenes
    showScene("scene3");

}

</script>

</body>
</html>
